<path d="M 620 963 L 620 997" fill="none" stroke="#0c8599" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 620 1113 L 620 1217" fill="none" stroke="#e67700" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 808 1055 L 1150 1055 L 1150 1217" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 432 1275 L 388 1275" fill="none" stroke="#e67700" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 808 1275 L 862 1275" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 220 1333 L 220 1392" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1025 1333 L 1025 1392" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 52 1275 L 20 1275 L 20 310 L 432 310" fill="none" stroke="#1864ab" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="40" y="52.0" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#000000">Approval is the start, not the finish.</text>
<text x="40" y="86.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#000000">Third-party GitHub Actions  |  Steps 0–7 match the guide  |  Two review lanes, one lifecycle</text>
<text x="40" y="296.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#000000">Every new SHA returns to review</text>
<text x="70" y="620.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">Turnaround starts with</text>
<text x="70" y="640.2" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">a complete request.</text>
<text x="925" y="620.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">Failed review? Stop, explain,</text>
<text x="925" y="640.2" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">remediate. Don't publish.</text>
<text x="830" y="1041.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#000000">Credible compromise</text>
<text x="632" y="1143.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">Every live SHA</text>
<text x="398" y="1261.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#000000">Fix</text>
<text x="232" y="1365.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#000000">Old SHA expires</text>
<text x="450" y="1426.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#000000">Approval is not permanent.</text>
<text x="450" y="1447.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#000000">Every approved SHA expires.</text>
<text x="40" y="1592.0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#000000">Platform team owns the process and tooling. Dev teams sponsor, adopt and remediate.</text>
</svg>
